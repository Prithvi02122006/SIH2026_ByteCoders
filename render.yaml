services:
  - type: web
    name: foodloop-backend
    runtime: python
    region: singapore          # Closest to India — change to ohio/frankfurt if needed
    plan: free                 # Upgrade to starter for persistent disk
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: ""              # Leave blank → uses SQLite in /tmp (ephemeral on free tier)
                               # For persistence: set to a PostgreSQL connection string
                               # e.g. from Render's managed Postgres add-on
      - key: JWT_SECRET_KEY
        generateValue: true    # Render auto-generates a secure random string
      - key: ALLOWED_ORIGINS
        value: "*"             # Replace with your Vercel URL after first deploy:
                               # e.g. https://your-project.vercel.app
    healthCheckPath: /
